<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Videollamada Docere</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0B192C',
              darkBlue: '#1E3E62',
              teal: '#00ADB5',
              green: '#10B981',
              emerald: '#059669'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-navy text-slate-100 flex flex-col justify-between min-h-screen font-sans antialiased selection:bg-brand-teal selection:text-slate-900">

  <!-- Header Responsive -->
  <header class="border-b border-brand-darkBlue bg-slate-900/80 backdrop-blur sticky top-0 z-50 py-3 px-4 sm:px-6 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-emerald to-brand-teal flex items-center justify-center font-bold text-white shadow-lg text-sm">
        D
      </div>
      <span class="text-lg sm:text-xl font-extrabold tracking-wide bg-gradient-to-r from-brand-teal to-brand-green bg-clip-text text-transparent">
        Docere Call
      </span>
    </div>
    <div id="status-badge" class="text-[10px] sm:text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
      Conectando...
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-6 flex flex-col gap-4 sm:gap-6 justify-center">

    <!-- Panel de Conexión & ID Corto Responsive -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-900/90 border border-brand-darkBlue p-4 sm:p-5 rounded-2xl shadow-xl">
      
      <!-- Mi ID -->
      <div class="flex flex-col justify-center border-b md:border-b-0 md:border-r border-slate-800 pb-3 md:pb-0 md:pr-4">
        <label class="text-[10px] sm:text-xs uppercase font-semibold text-brand-teal tracking-wider mb-1">Tu Código de Sala</label>
        <div class="flex items-center gap-2">
          <span id="my-id-display" class="font-mono text-xl sm:text-2xl font-bold text-brand-green bg-slate-950 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl border border-brand-emerald/30 tracking-wider flex-1 text-center sm:text-left">
            ------
          </span>
          <button onclick="copiarID()" class="bg-brand-darkBlue hover:bg-slate-700 text-xs px-3 py-2.5 rounded-xl border border-slate-600 transition font-medium active:scale-95">
            Copiar
          </button>
        </div>
        <p class="text-[11px] text-slate-400 mt-1.5">Comparte este código de 6 caracteres con tu amiga.</p>
      </div>

      <!-- Conectarse a Amiga -->
      <div class="flex flex-col justify-center pt-1 md:pt-0">
        <label class="text-[10px] sm:text-xs uppercase font-semibold text-brand-teal tracking-wider mb-1">Ingresar Código de tu Amiga</label>
        <div class="flex gap-2">
          <input id="remote-id-input" type="text" placeholder="Ej: 7X9K2P" maxlength="6" class="uppercase font-mono tracking-wider flex-1 px-3 py-2 bg-slate-950 border border-slate-700 focus:border-brand-teal rounded-xl text-white outline-none text-sm">
          <button onclick="llamarAmiga()" class="bg-gradient-to-r from-brand-teal to-brand-emerald hover:opacity-90 font-bold px-5 py-2 rounded-xl text-slate-950 transition shadow-lg shadow-brand-teal/20 text-sm active:scale-95">
            Unirse
          </button>
        </div>
      </div>

    </div>

    <!-- Video Grid Adaptable (Modo Apilado en Móvil / Lado a Lado en Pantalla Grande) -->
    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 items-center">
      
      <!-- Mi Video -->
      <div class="relative bg-slate-950 rounded-2xl overflow-hidden aspect-video shadow-2xl border border-brand-darkBlue group w-full">
        <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
        <div id="video-off-overlay" class="hidden absolute inset-0 bg-slate-900 flex items-center justify-center text-slate-500 text-xs sm:text-sm font-medium">
          Cámara Desactivada
        </div>
        <div class="absolute bottom-2.5 left-2.5 bg-slate-900/80 backdrop-blur border border-slate-700/50 px-2.5 py-1 rounded-full text-[11px] sm:text-xs font-medium text-brand-teal flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-brand-green animate-pulse"></span>
          <span id="local-label-text">Tú (Cámara local)</span>
        </div>
      </div>

      <!-- Video Remoto -->
      <div class="relative bg-slate-950 rounded-2xl overflow-hidden aspect-video shadow-2xl border border-brand-darkBlue flex items-center justify-center w-full">
        <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
        
        <div id="placeholder" class="text-center p-4 sm:p-6 flex flex-col items-center gap-2 sm:gap-3">
          <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-brand-darkBlue/50 border border-brand-teal/30 flex items-center justify-center text-brand-teal">
            <svg class="w-6 h-6 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          </div>
          <p class="text-slate-400 text-xs sm:text-sm max-w-xs">Esperando que ingreses un código o que alguien se una a la sala...</p>
        </div>

        <div id="remote-label" class="hidden absolute bottom-2.5 left-2.5 bg-slate-900/80 backdrop-blur border border-slate-700/50 px-2.5 py-1 rounded-full text-[11px] sm:text-xs font-medium text-brand-green flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-brand-green"></span>
          Conectado
        </div>
      </div>

    </div>

    <!-- Barra de Controles Móvil Adaptativa -->
    <div class="flex justify-center items-center gap-2 sm:gap-4 py-2">
      <!-- Botón Micrófono -->
      <button id="btn-audio" onclick="toggleAudio()" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-5 py-3 rounded-xl bg-brand-darkBlue hover:bg-slate-700 text-white font-medium border border-slate-600 transition shadow-lg text-xs sm:text-sm active:scale-95">
        <svg id="icon-mic-on" class="w-4 h-4 sm:w-5 sm:h-5 text-brand-green shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"></path></svg>
        <svg id="icon-mic-off" class="w-4 h-4 sm:w-5 sm:h-5 text-red-400 hidden shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
        <span id="label-mic" class="truncate">Mic</span>
      </button>

      <!-- Botón Cámara -->
      <button id="btn-video" onclick="toggleVideo()" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-5 py-3 rounded-xl bg-brand-darkBlue hover:bg-slate-700 text-white font-medium border border-slate-600 transition shadow-lg text-xs sm:text-sm active:scale-95">
        <svg id="icon-cam-on" class="w-4 h-4 sm:w-5 sm:h-5 text-brand-teal shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        <svg id="icon-cam-off" class="w-4 h-4 sm:w-5 sm:h-5 text-red-400 hidden shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
        <span id="label-cam" class="truncate">Cam</span>
      </button>

      <!-- Botón Compartir Pantalla con Detección Móvil -->
      <button id="btn-screen" onclick="toggleScreenShare()" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-5 py-3 rounded-xl bg-brand-darkBlue hover:bg-slate-700 text-white font-medium border border-slate-600 transition shadow-lg text-xs sm:text-sm active:scale-95">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 text-brand-teal shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        <span id="label-screen" class="truncate">Pantalla</span>
      </button>
    </div>

  </main>

  <footer class="text-center py-3 text-[11px] text-slate-500 border-t border-slate-900">
    Desarrollado para <a href="https://cursosdocere.com" target="_blank" class="text-brand-teal hover:underline font-medium">cursosdocere.com</a>
  </footer>

  <script>
    let localStream;
    let currentCall = null;
    let peer;
    let audioEnabled = true;
    let videoEnabled = true;
    let isSharingScreen = false;
    let screenStream = null;

    function generarIDCorto() {
      const caracteres = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let resultado = '';
      for (let i = 0; i < 6; i++) {
        resultado += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
      }
      return resultado;
    }

    // Configuración para navegadores móviles
    const constraints = {
      video: {
        width: { ideal: 1280 },
        height: { ideal: 720 },
        facingMode: "user"
      },
      audio: true
    };

    navigator.mediaDevices.getUserMedia(constraints)
      .then(stream => {
        localStream = stream;
        document.getElementById('local-video').srcObject = stream;
        iniciarPeer();
      })
      .catch(err => {
        alert("Atención: Asegúrate de permitir el acceso a tu cámara y micrófono en tu celular.");
      });

    function iniciarPeer() {
      const miIDCorto = generarIDCorto();
      peer = new Peer(miIDCorto);

      peer.on('open', id => {
        document.getElementById('my-id-display').innerText = id;
        const statusBadge = document.getElementById('status-badge');
        statusBadge.innerText = '● Servidor listo';
        statusBadge.className = 'text-[10px] sm:text-xs px-2.5 py-1 rounded-full bg-brand-emerald/10 text-brand-green border border-brand-green/30';
      });

      peer.on('call', call => {
        currentCall = call;
        call.answer(localStream);
        call.on('stream', remoteStream => {
          mostrarVideoRemoto(remoteStream);
        });
      });
    }

    function llamarAmiga() {
      const input = document.getElementById('remote-id-input');
      const remoteId = input.value.trim().toUpperCase();

      if (!remoteId) {
        alert("Ingresa el código corto de 6 caracteres.");
        return;
      }

      currentCall = peer.call(remoteId, localStream);
      currentCall.on('stream', remoteStream => {
        mostrarVideoRemoto(remoteStream);
      });
    }

    function mostrarVideoRemoto(stream) {
      document.getElementById('placeholder').classList.add('hidden');
      document.getElementById('remote-label').classList.remove('hidden');
      document.getElementById('remote-video').srcObject = stream;
    }

    function copiarID() {
      const id = document.getElementById('my-id-display').innerText;
      if (id !== '------') {
        navigator.clipboard.writeText(id);
        alert('Código de sala copiado: ' + id);
      }
    }

    // --- Control de Micrófono & Cámara ---

    function toggleAudio() {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioEnabled = !audioEnabled;
        audioTrack.enabled = audioEnabled;

        document.getElementById('icon-mic-on').classList.toggle('hidden', !audioEnabled);
        document.getElementById('icon-mic-off').classList.toggle('hidden', audioEnabled);
        document.getElementById('label-mic').innerText = audioEnabled ? 'Mic' : 'Silencio';
        
        const btn = document.getElementById('btn-audio');
        btn.classList.toggle('border-red-500/50', !audioEnabled);
        btn.classList.toggle('bg-red-950/30', !audioEnabled);
      }
    }

    function toggleVideo() {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        videoEnabled = !videoEnabled;
        videoTrack.enabled = videoEnabled;

        document.getElementById('video-off-overlay').classList.toggle('hidden', videoEnabled);
        document.getElementById('icon-cam-on').classList.toggle('hidden', !videoEnabled);
        document.getElementById('icon-cam-off').classList.toggle('hidden', videoEnabled);
        document.getElementById('label-cam').innerText = videoEnabled ? 'Cam' : 'Sin Cam';

        const btn = document.getElementById('btn-video');
        btn.classList.toggle('border-red-500/50', !videoEnabled);
        btn.classList.toggle('bg-red-950/30', !videoEnabled);
      }
    }

    // --- Compartir Pantalla Adaptado a Móviles ---

    async function toggleScreenShare() {
      // 1. Validar si el navegador o sistema móvil soporta la API de compartir pantalla
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        alert("Tu navegador móvil actual no soporta compartir pantalla.\n\nSugerencia: Abre este enlace en Chrome/Firefox (Android) o Safari (iOS 13+). Si abriste la app dentro de WhatsApp, presiona los 3 puntos y elige 'Abrir en el navegador'.");
        return;
      }

      if (!isSharingScreen) {
        try {
          // Solicitar captura de pantalla
          screenStream = await navigator.mediaDevices.getDisplayMedia({ 
            video: {
              cursor: "always"
            },
            audio: false 
          });

          const screenTrack = screenStream.getVideoTracks()[0];

          // Reemplazar la pista en la llamada activa
          if (currentCall && currentCall.peerConnection) {
            const sender = currentCall.peerConnection.getSenders().find(s => s && s.track && s.track.kind === 'video');
            if (sender) sender.replaceTrack(screenTrack);
          }

          // Ajustar vista local
          const localVideo = document.getElementById('local-video');
          localVideo.srcObject = screenStream;
          localVideo.classList.remove('-scale-x-100'); // Sin reflejo de espejo para leer texto
          document.getElementById('local-label-text').innerText = 'Tú (Compartiendo pantalla)';

          // Evento al detener transmisión desde el SO/navegador
          screenTrack.onended = () => deteniendoPantalla();

          isSharingScreen = true;
          actualizarBotonPantalla(true);

        } catch (err) {
          if (err.name !== 'NotAllowedError') {
            alert("No se pudo transmitir la pantalla desde este dispositivo. Asegúrate de dar los permisos del sistema.");
          }
        }
      } else {
        deteniendoPantalla();
      }
    }

    function deteniendoPantalla() {
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
      }

      const cameraTrack = localStream.getVideoTracks()[0];

      // Restaurar la cámara en la transmisión
      if (currentCall && currentCall.peerConnection) {
        const sender = currentCall.peerConnection.getSenders().find(s => s && s.track && s.track.kind === 'video');
        if (sender) sender.replaceTrack(cameraTrack);
      }

      // Restaurar vista local
      const localVideo = document.getElementById('local-video');
      localVideo.srcObject = localStream;
      localVideo.classList.add('-scale-x-100'); // Volver a aplicar espejo para la cámara
      document.getElementById('local-label-text').innerText = 'Tú (Cámara local)';

      isSharingScreen = false;
      actualizarBotonPantalla(false);
    }

    function actualizarBotonPantalla(activa) {
      const btn = document.getElementById('btn-screen');
      const label = document.getElementById('label-screen');
      if (activa) {
        label.innerText = 'Detener';
        btn.classList.add('border-brand-green/80', 'bg-brand-emerald/20');
      } else {
        label.innerText = 'Pantalla';
        btn.classList.remove('border-brand-green/80', 'bg-brand-emerald/20');
      }
    }
  </script>
</body>
</html>
